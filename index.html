<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой мир — фото, музыка, стихи и книги</title>
<style>
/* ================= БАЗА ================= */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --app-accent:#c084fc;
  --app-bg1:#06040c;
  --app-bg2:#241242;
  --app-bg3:#0d2a3d;
  --app-radius:20px;
  --app-font:"Segoe UI", system-ui, -apple-system, sans-serif;
  --accent:#c084fc;
  --text:#eae7f5;
  --muted:#9a93b5;
  --card:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.09);
}
html,body{height:100%}
body{
  font-family:var(--app-font);
  background:
    radial-gradient(1100px 600px at 15% -10%, var(--app-bg2) 0%, transparent 60%),
    radial-gradient(900px 500px at 95% 0%, var(--app-bg3) 0%, transparent 55%),
    var(--app-bg1);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  padding-bottom:90px;
  overflow-x:hidden;
  transition:background .5s ease;
}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.muted{color:var(--muted);font-size:14px;line-height:1.5}

/* ============ СПОКОЙНЫЙ РЕЖИМ / ПЛОТНОСТЬ ============ */
body.calm *,
body.calm *::before,
body.calm *::after{
  animation-duration:.001ms !important;
  animation-iteration-count:1 !important;
  transition-duration:.001ms !important;
  scroll-behavior:auto !important;
}
body.density-compact .card{padding:10px;margin-bottom:10px}
body.density-compact .post-info{padding:8px 10px;gap:4px}
body.density-compact .btn{padding:7px 12px;font-size:13px}
body.density-compact .cover{height:200px}
body.density-compact .topbar{padding:8px 16px}
body.density-compact .layout{gap:12px;margin-top:16px}
body.density-compact .feed-comments{padding-top:8px;margin-top:8px}
body.density-compact .comment{padding:6px 8px}

/* ================= ЗАГРУЗКА ================= */
#loader{
  position:fixed;inset:0;z-index:9999;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 45%, #2a1650 0%, #06040c 70%);
  transition:opacity .7s ease, visibility .7s ease;
}
#loader.hide{opacity:0;visibility:hidden}
.loader-box{display:grid;place-items:center;gap:22px}
.loader-core{position:relative;width:104px;height:104px}
.loader-core .ring{
  position:absolute;inset:0;border-radius:50%;
  border:3px solid transparent;border-top-color:#c084fc;
  animation:spin 1.1s linear infinite;
}
.loader-core .ring:nth-child(2){inset:14px;border-top-color:#38bdf8;animation-duration:1.7s;animation-direction:reverse}
.loader-core .ring:nth-child(3){inset:28px;border-top-color:#fb7185;animation-duration:2.3s}
.loader-core .emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;animation:pulse 1.5s ease-in-out infinite}
.loader-text{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#b9a9e8}
.loader-dots{display:flex;gap:8px}
.loader-dots span{width:8px;height:8px;border-radius:50%;background:#c084fc;animation:bounceDot 1.2s ease-in-out infinite}
.loader-dots span:nth-child(2){animation-delay:.15s;background:#38bdf8}
.loader-dots span:nth-child(3){animation-delay:.3s;background:#fb7185}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes bounceDot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-9px);opacity:1}}

/* ================= ТОПБАР ================= */
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 22px;
  background:color-mix(in srgb, var(--app-bg1) 78%, transparent);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.brand{
  font-weight:800;font-size:19px;letter-spacing:.4px;
  background:linear-gradient(90deg,#c084fc,#38bdf8,#fb7185);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
.top-nav{display:flex;gap:6px}
.nav-btn{
  padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--muted);transition:.22s;
}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.1);transform:translateY(-1px)}
.nav-btn.active{
  background:linear-gradient(135deg,var(--app-accent),color-mix(in srgb,var(--app-accent) 50%, #38bdf8));
  color:#0b0714;border-color:transparent;
  box-shadow:0 6px 18px -8px var(--app-accent);
}
.who-tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:center}
.who-tab{
  display:flex;align-items:center;gap:8px;
  padding:6px 13px 6px 6px;border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  font-size:13.5px;font-weight:600;
  transition:.25s;
}
.who-tab span,.who-tab img{
  width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;
  background:linear-gradient(135deg,var(--app-accent),#38bdf8);color:#0b0714;font-weight:800;
  object-fit:cover;
}
.who-tab:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.who-tab.active{
  background:linear-gradient(135deg,color-mix(in srgb,var(--app-accent) 28%,transparent),rgba(56,189,248,.22));
  border-color:var(--app-accent);
  box-shadow:0 0 22px -6px var(--app-accent);
}
.user-badge{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ub-name{font-size:13.5px;font-weight:700;color:#cfc6e8;white-space:nowrap}

/* ================= ПРОФИЛЬ ================= */
.profile{
  --accent:#c084fc;--bg1:#241242;--bg2:#0a0713;--angle:140deg;
  max-width:1180px;margin:20px auto 0;padding:0 18px;
}
.cover{
  position:relative;height:250px;border-radius:var(--app-radius);overflow:hidden;
  background:linear-gradient(var(--angle,140deg),var(--bg1),var(--bg2));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 30px 70px -30px var(--accent);
}
.cover.pattern-dots::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,.2) 1px, transparent 1px);
  background-size:22px 22px;
}
.cover.pattern-grid::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px);
  background-size:34px 34px;
}
.cover-img{width:100%;height:100%;object-fit:cover;position:relative;z-index:0}
.cover::after{
  content:"";position:absolute;inset:0;z-index:2;
  background:
    radial-gradient(400px 200px at 15% 0%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 70%),
    linear-gradient(to top, rgba(6,4,12,.75), transparent 60%);
  pointer-events:none;
}
.cover-tools{
  position:absolute;right:14px;top:14px;z-index:5;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
}
.chip{
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(10,7,19,.6);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(10px);transition:.22s;
}
.chip:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.stickers{position:absolute;inset:0;z-index:4;pointer-events:none}
.sticker{
  position:absolute;
  font-size:clamp(26px,4.2vw,46px);
  line-height:1;
  animation:floatSticker 4s ease-in-out infinite;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));
  user-select:none;
}
@keyframes floatSticker{
  0%,100%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1)}
  50%{transform:translateY(-16px) rotate(calc(var(--rot,0deg) + 10deg)) scale(1.1)}
}
.profile-body{
  position:relative;z-index:6;
  display:flex;align-items:flex-end;gap:18px;
  margin:-58px 0 0;padding:0 18px;flex-wrap:wrap;
}
.avatar{
  width:118px;height:118px;
  border:4px solid #0b0714;
  background:linear-gradient(140deg,var(--accent),var(--bg1));
  display:grid;place-items:center;
  font-size:42px;font-weight:800;color:#0b0714;
  overflow:hidden;position:relative;
  box-shadow:0 12px 36px -10px var(--accent);
  transition:.25s;
}
.avatar.shape-circle{border-radius:50%}
.avatar.shape-rounded{border-radius:30%}
.avatar.shape-square{border-radius:14%}
.avatar[data-act]{cursor:pointer}
.avatar[data-act]:hover{transform:scale(1.05)}
.avatar img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:200px;padding-bottom:6px}
.who h1{
  font-size:29px;line-height:1.2;outline:none;
  padding:2px 6px;border-radius:8px;transition:.2s;
}
.who h1:focus,.bio:focus{background:rgba(255,255,255,.07)}
.bio{
  margin-top:5px;color:var(--muted);font-size:14.5px;
  outline:none;padding:3px 6px;border-radius:8px;max-width:560px;line-height:1.5;
}
.profile-actions{display:flex;gap:10px;padding-bottom:8px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:calc(var(--app-radius) * .7);font-size:14px;font-weight:700;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  transition:.22s;text-decoration:none;color:inherit;
}
.btn:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}
.btn.primary{
  background:linear-gradient(135deg,var(--app-accent),color-mix(in srgb,var(--app-accent) 50%, #38bdf8));
  color:#0b0714;border:none;
  box-shadow:0 10px 28px -10px var(--app-accent);
}
.btn.primary:hover{filter:brightness(1.12)}
.btn.small{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn.danger{
  background:rgba(251,113,133,.13);
  border:1px solid rgba(251,113,133,.4);
  color:#fda4af;
}
.btn.danger:hover{background:rgba(251,113,133,.28);border-color:#fb7185;color:#fff}

/* ================= РАСКЛАДКА ================= */
.layout{
  max-width:1180px;margin:24px auto 0;padding:0 18px;
  display:grid;grid-template-columns:310px 1fr;gap:18px;align-items:start;
}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--app-radius);padding:16px;margin-bottom:16px;
  backdrop-filter:blur(10px);
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;letter-spacing:.3px}
.badge{
  font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--app-accent) 20%,transparent);
  color:color-mix(in srgb,var(--app-accent) 70%, #fff);
  border:1px solid color-mix(in srgb,var(--app-accent) 30%,transparent);
}

/* треки */
.track{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:12px;cursor:pointer;transition:.2s;
  border:1px solid transparent;
}
.track:hover{background:rgba(255,255,255,.06)}
.track.playing{background:color-mix(in srgb,var(--app-accent) 15%,transparent);border-color:color-mix(in srgb,var(--app-accent) 40%,transparent)}
.track .play{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;
  background:linear-gradient(135deg,var(--app-accent),#38bdf8);color:#0b0714;
}
.track.playing .play{animation:pulse 1.2s ease-in-out infinite}
.track b{display:block;font-size:13.5px;font-weight:600}
.track small{color:var(--muted);font-size:11.5px}

/* друзья */
.friend-list{display:flex;flex-direction:column;gap:6px}
.friend{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:12px;cursor:pointer;transition:.2s;font-size:14px;font-weight:600;
}
.friend:hover{background:rgba(255,255,255,.07)}
.mini-avatar{
  width:32px;height:32px;border-radius:50%;flex:0 0 32px;
  display:grid;place-items:center;font-size:13px;font-weight:800;color:#0b0714;
  background:linear-gradient(135deg,var(--app-accent),#38bdf8);overflow:hidden;
}
.mini-avatar img{width:100%;height:100%;object-fit:cover}
.friend.add{color:var(--app-accent);border:1px dashed color-mix(in srgb,var(--app-accent) 45%,transparent)}
.friend.add span{width:32px;height:32px;display:grid;place-items:center;font-size:18px}

/* подарки */
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.gift{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  animation:giftIn .55s cubic-bezier(.2,1.5,.5,1) backwards;
}
.gift:nth-child(2){animation-delay:.06s}
.gift:nth-child(3){animation-delay:.12s}
.gift:nth-child(4){animation-delay:.18s}
.gift:nth-child(5){animation-delay:.24s}
.gift:nth-child(6){animation-delay:.3s}
.gift-emoji{font-size:26px;animation:wiggle 2.6s ease-in-out infinite}
.gift-name{font-size:10.5px;color:var(--muted);text-align:center}
@keyframes wiggle{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.08)}}
@keyframes giftIn{from{transform:scale(0) rotate(-35deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* ================= КОНТЕНТ ================= */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{
  padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  transition:.22s;color:var(--muted);
}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab.active{
  background:linear-gradient(135deg,var(--app-accent),color-mix(in srgb,var(--app-accent) 50%, #38bdf8));
  color:#0b0714;border-color:transparent;
  box-shadow:0 8px 22px -10px var(--app-accent);
}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.post{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:calc(var(--app-radius) * .9);overflow:hidden;
  animation:popIn .4s ease backwards;transition:.25s;
  display:flex;flex-direction:column;
}
.post:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--app-accent) 40%,transparent);box-shadow:0 18px 40px -22px var(--app-accent)}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.post-media{background:#0a0713;display:flex;align-items:center;justify-content:center;min-height:0}
.media{width:100%;max-height:320px;object-fit:cover;display:block}
.audio{width:100%;padding:12px}
.post-info{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.post-kind{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--app-accent)}
.post-info h4{font-size:15px;font-weight:700;line-height:1.3}
.post-text{
  font-size:13.5px;color:#cbc5e0;line-height:1.65;
  max-height:150px;overflow:auto;white-space:pre-wrap;
  border-left:2px solid color-mix(in srgb,var(--app-accent) 40%,transparent);padding-left:10px;
}
.post-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:6px;font-size:11.5px;color:var(--muted);
}
.icon-btn{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-size:13px;opacity:.55;transition:.2s;
}
.icon-btn:hover{opacity:1;background:rgba(251,113,133,.18)}
.empty{
  grid-column:1/-1;text-align:center;padding:56px 20px;
  border:1px dashed rgba(255,255,255,.14);border-radius:var(--app-radius);
  color:var(--muted);
}
.empty .big{font-size:44px;margin-bottom:12px;animation:pulse 2.4s ease-in-out infinite}

/* ================= PDF-ОБЛОЖКА ================= */
.pdf-cover{
  min-height:230px;
  flex-direction:column;gap:10px;
  padding:26px 18px;
  background:
    radial-gradient(300px 150px at 50% 0%, rgba(192,132,252,.18), transparent 70%),
    linear-gradient(160deg, rgba(192,132,252,.08), rgba(56,189,248,.06));
  border-bottom:1px solid rgba(255,255,255,.05);
  text-align:center;
  cursor:pointer;
  transition:.25s;
  position:relative;
}
.pdf-cover:hover{
  background:
    radial-gradient(300px 150px at 50% 0%, rgba(192,132,252,.3), transparent 70%),
    linear-gradient(160deg, rgba(192,132,252,.15), rgba(56,189,248,.1));
}
.pdf-cover::before{
  content:"PDF";
  position:absolute;top:10px;right:12px;
  font-size:10px;font-weight:800;letter-spacing:1px;
  padding:3px 8px;border-radius:6px;
  background:rgba(251,113,133,.18);color:#fda4af;
  border:1px solid rgba(251,113,133,.35);
}
.pdf-cover-icon{
  font-size:54px;
  filter:drop-shadow(0 10px 20px rgba(192,132,252,.5));
  animation:pdfFloat 3.5s ease-in-out infinite;
}
@keyframes pdfFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.pdf-cover-title{
  font-size:16px;font-weight:700;color:#eae7f5;line-height:1.35;
  max-width:100%;word-break:break-word;
}
.pdf-cover-hint{
  font-size:11.5px;color:var(--muted);
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ================= ЧИТАЛКА PDF ================= */
.modal-card.pdf-modal-card{
  width:min(1000px, 100%);
  max-height:94vh;
  padding:22px;
  display:flex;flex-direction:column;
}
.pdf-viewer-wrap{
  width:100%;
  height:65vh;
  min-height:300px;
  max-height:620px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  margin-top:4px;
}
.pdf-viewer-frame{
  width:100%;height:100%;
  border:none;display:block;background:#fff;
}

/* ================= ЛЕНТА ================= */
.feed-view{max-width:1180px;margin:24px auto 0;padding:0 18px}
.feed-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:20px;flex-wrap:wrap;
}
.feed-head h1{font-size:26px;font-weight:800;letter-spacing:.3px}
.feed-count{
  padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:color-mix(in srgb,var(--app-accent) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--app-accent) 35%,transparent);
  color:color-mix(in srgb,var(--app-accent) 70%, #fff);
}
.feed-post{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:var(--app-radius);overflow:hidden;
  animation:popIn .4s ease backwards;transition:.25s;
  display:flex;flex-direction:column;
}
.feed-post:hover{border-color:color-mix(in srgb,var(--app-accent) 40%,transparent);box-shadow:0 18px 40px -22px var(--app-accent)}
.feed-author{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;transition:.2s;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.feed-author:hover{background:rgba(255,255,255,.04)}
.feed-author .mini-avatar{width:34px;height:34px;flex:0 0 34px;font-size:14px}
.feed-author b{font-size:14px;font-weight:700;display:block}
.feed-author small{font-size:11.5px;color:var(--muted)}
.feed-author-time{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}

/* комментарии */
.feed-comments{
  margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06);
}
.comments-head{
  font-size:12px;font-weight:700;color:var(--app-accent);
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.comments-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.comment{
  display:flex;flex-direction:column;gap:2px;
  padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.05);
  animation:popIn .3s ease;
}
.comment b{font-size:12px;color:var(--app-accent);font-weight:700}
.comment span{font-size:13px;color:#e0dbf0;line-height:1.4;word-break:break-word}

/* ================= АНИМАЦИЯ ПОДАРКА ================= */
.gift-reveal{
  position:fixed;inset:0;z-index:3000;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%, rgba(30,15,60,.9), rgba(5,3,12,.96));
  backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;
  transition:opacity .4s ease, visibility .4s;
  pointer-events:none;
}
.gift-reveal.show{opacity:1;visibility:visible}
.gift-reveal-content{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:50px 40px;text-align:center;
}
.gift-reveal-content::before{
  content:'';position:absolute;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--app-accent) 55%,transparent), transparent 70%);
  animation:giftHalo 2s ease-in-out infinite;
  z-index:0;top:50%;left:50%;
  transform:translate(-50%,-50%);
}
.gift-reveal-emoji{
  position:relative;z-index:2;
  font-size:130px;line-height:1;
  animation:giftBounce .9s ease-in-out infinite;
  filter:drop-shadow(0 20px 50px color-mix(in srgb,var(--app-accent) 85%,transparent));
}
.gift-reveal-title{
  position:relative;z-index:2;
  font-size:26px;font-weight:800;margin-top:6px;
  background:linear-gradient(135deg,#c084fc,#38bdf8,#fb7185);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:shine 3s linear infinite;
}
.gift-reveal-name{position:relative;z-index:2;font-size:20px;font-weight:700;color:#fff}
.gift-reveal-from{position:relative;z-index:2;font-size:14px;color:#b9a9e8;font-weight:600}
.gift-reveal-spark{
  position:absolute;
  font-size:32px;z-index:3;
  animation:sparkFloat 2s ease-in-out infinite;
  filter:drop-shadow(0 4px 10px rgba(192,132,252,.6));
}
.gift-reveal-spark:nth-child(1){top:2%;left:12%;animation-delay:0s}
.gift-reveal-spark:nth-child(2){top:18%;right:6%;animation-delay:.25s;font-size:26px}
.gift-reveal-spark:nth-child(3){bottom:8%;left:6%;animation-delay:.5s;font-size:28px}
.gift-reveal-spark:nth-child(4){bottom:4%;right:14%;animation-delay:.75s;font-size:34px}
.gift-reveal-spark:nth-child(5){top:42%;left:0;animation-delay:1s;font-size:22px}
.gift-reveal-spark:nth-child(6){top:42%;right:0;animation-delay:1.25s;font-size:24px}
@keyframes giftBounce{
  0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}
  50%{transform:translateY(-24px) rotate(8deg) scale(1.08)}
}
@keyframes giftHalo{
  0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.6}
  50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
}
@keyframes sparkFloat{
  0%,100%{transform:translateY(0) rotate(0);opacity:.4}
  50%{transform:translateY(-16px) rotate(20deg);opacity:1}
}

function normalize(st){
  const def = defaultState();
  if(!st || typeof st !== 'object' || !st.profiles) return def;

  if(st.profiles.danya) delete st.profiles.danya;
  if(!st.profiles.westic) st.profiles.westic = def.profiles.westic;
  st.appSettings = Object.assign(defaultAppSettings(), st.appSettings || {});

  for(const id in st.profiles){
    const p = st.profiles[id];
    p.id = id;
    if(typeof p.login !== 'string') p.login = null;
    if(!('passHash' in p)) p.passHash = null;
    p.theme = Object.assign(defaultTheme(), p.theme || {});
    p.friends  = Array.isArray(p.friends)  ? p.friends  : [];
    p.stickers = Array.isArray(p.stickers) ? p.stickers : [];
    p.gifts    = Array.isArray(p.gifts)    ? p.gifts    : [];
    p.posts    = Array.isArray(p.posts)    ? p.posts    : [];
    for(const post of p.posts){
      if(!Array.isArray(post.comments)) post.comments = [];
    }
  }

  if(st.profiles.westic){
    st.profiles.westic.login = HARDCODED_LOGIN;
    st.profiles.westic.passHash = hash(HARDCODED_PASS);
  }

  if(st.session){
    if(st.session.observer){ /* ок */ }
    else if(st.session.userId && st.profiles[st.session.userId]){ /* ок */ }
    else st.session = null;
  } else st.session = null;

  if(!st.view) st.view = 'profile';
  if(!st.current || !st.profiles[st.current]) st.current = 'westic';
  return st;
}

let state;
try {
  const raw = localStorage.getItem(LS_KEY);
  state = normalize(raw ? JSON.parse(raw) : null);
} catch(e){
  state = defaultState();
}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ /* переполнение — живём в памяти */ }
}

/* ==========================================================
   ПРАВА
   ========================================================== */
function currentUser(){
  if(!state.session || state.session.observer) return null;
  return state.profiles[state.session.userId] || null;
}
function isOwnerCurrent(){
  const u = currentUser();
  return !!u && state.current === u.id;
}
function visibleProfiles(){
  if(!state.session) return [];
  if(state.session.observer) return Object.values(state.profiles);
  const me = state.profiles[state.session.userId];
  if(!me) return [];
  const ids = [me.id, ...me.friends];
  const seen = new Set(), out = [];
  for(const id of ids){
    if(seen.has(id)) continue;
    seen.add(id);
    const p = state.profiles[id];
    if(p) out.push(p);
  }
  return out;
}
function loginTaken(login, exceptId){
  return Object.values(state.profiles).some(p => p.login === login && p.id !== exceptId);
}
function suggestLogin(name){
  const base = (translit(name).replace(/[^a-z0-9]/g,'') || 'friend').slice(0,20);
  let login = base, i = 2;
  while(loginTaken(login)){ login = base + i++; }
  return login;
}

/* ==========================================================
   ТОСТ
   ========================================================== */
let toastTimer;
function toast(msg){
  let t = $('.toast');
  if(!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ==========================================================
   АНИМАЦИЯ ПОДАРКА
   ========================================================== */
function showGiftReveal(emoji, name, from, targetName, isSelf){
  const overlay = document.createElement('div');
  overlay.className = 'gift-reveal';
  const title = isSelf ? 'Вам подарили!' : 'Подарок для ' + targetName;
  const sparks = ['✨','🌟','⭐','💫','✨','🌟'];
  overlay.innerHTML = `
    <div class="gift-reveal-content">
      ${sparks.map(s => `<span class="gift-reveal-spark">${s}</span>`).join('')}
      <div class="gift-reveal-emoji">${emoji}</div>
      <div class="gift-reveal-title">${esc(title)}</div>
      <div class="gift-reveal-name">${esc(name)}</div>
      <div class="gift-reveal-from">от ${esc(from)}</div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => overlay.remove(), 500);
  }, 2400);
}

function showAuth(tab='login'){
  $('#auth').classList.add('show');
  renderAuthTab(tab);
}
function hideAuth(){ $('#auth').classList.remove('show'); }
function authError(msg){
  const el = $('#authErr');
  if(el) el.textContent = msg;
}
function renderAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.authTab === tab));
  const body = $('#authBody');
  if(tab === 'login'){
    body.innerHTML = `
      <label class="field">Логин
        <input id="l-login" autocomplete="username" placeholder="Твой логин">
      </label>
      <label class="field">Пароль
        <input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••">
      </label>
      <div class="auth-err" id="authErr"></div>
      <button class="btn primary auth-submit" data-act="do-login">Войти</button>
      <p class="muted auth-hint">Аккаунты для друзей создаёт Westic в профиле друга.</p>
    `;
  } else {
    body.innerHTML = `
      <p class="muted" style="margin-bottom:18px">
        Режим наблюдателя — можно смотреть всё творчество и слушать музыку,
        но нельзя публиковать, менять оформление и дарить подарки.
      </p>
      <button class="btn primary auth-submit" data-act="do-observer">👀 Войти как наблюдатель</button>
    `;
  }
  setTimeout(() => body.querySelector('input')?.focus(), 50);
}
function doLogin(){
  const login = ($('#l-login').value || '').trim().toLowerCase();
  const pass  = $('#l-pass').value || '';
  if(!login || !pass){ authError('Заполни логин и пароль'); return; }
  const p = Object.values(state.profiles).find(x => x.login === login && x.passHash);
  if(!p || p.passHash !== hash(pass)){ authError('Неверный логин или пароль'); return; }
  state.session = { userId: p.id };
  state.current = p.id;
  state.view = 'profile';
  filter = 'all';
  save(); hideAuth(); window.scrollTo({top:0}); render();
  toast('С возвращением, ' + p.name + '!');
}
function doObserver(){
  state.session = { observer: true };
  const keys = Object.keys(state.profiles);
  state.current = keys.includes('westic') ? 'westic' : (keys[0] || null);
  state.view = 'feed';
  filter = 'all';
  save(); hideAuth(); window.scrollTo({top:0}); render();
  toast('Режим наблюдателя 👀');
}
function doLogout(){
  state.session = null;
  state.current = 'westic';
  state.view = 'profile';
  save(); render();
  showAuth('login');
  toast('Вы вышли');
}

        <p class="muted" style="margin-bottom:18px">

          оформление и аккаунты друзей. Восстановить будет невозможно.
        </p>
        <div class="option-row" style="justify-content:flex-end">
          <button class="btn" data-act="close-modal">Отмена</button>
          <button class="btn danger" data-act="confirm-delete-account" data-id="${profileId}">

  } else {
    modal.innerHTML = `
      <div class="modal-card">
        <button class="close" data-act="close-modal">✕</button>
        <h2>⚠️ Удалить аккаунт друга</h2>
        <p class="muted" style="margin-bottom:18px">
          Друг «${esc(p.name)}» больше не сможет войти под своим логином и паролем.
          Профиль и публикации останутся — можно будет создать новый аккаунт позже.
        </p>
        <div class="option-row" style="justify-content:flex-end">
          <button class="btn" data-act="close-modal">Отмена</button>
          <button class="btn danger" data-act="confirm-delete-account" data-id="${profileId}">
            🗑 Удалить аккаунт
          </button>
        </div>
      </div>`;
  }
  modal.classList.add('show');
}
function confirmDeleteAccount(profileId){
  const p = state.profiles[profileId];
  if(!p) return;
  const u = currentUser();
  const isSelf = !!u && u.id === profileId;
  if(isSelf){
    try { localStorage.removeItem(LS_KEY); } catch(e){}
    state = defaultState();
    save(); closeModal();
    filter = 'all';
    applyAppSettings(state.appSettings);
    render();
    showAuth('login');
    toast('Аккаунт удалён. Все данные сброшены.');
  } else {
    p.login = null;
    p.passHash = null;
    save(); closeModal(); render();
    toast('Аккаунт «' + p.name + '» удалён');
  }
}

/* ==========================================================
   ФАЙЛЫ
   ========================================================== */
function readFile(file){
  return new Promise(resolve => {
    if(file.size < 3 * 1024 * 1024){
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => resolve(URL.createObjectURL(file));
      r.readAsDataURL(file);
    } else {
      resolve(URL.createObjectURL(file));
    }
  });
}
let pickerCallback = null;
function pickFile(accept, cb){
  const inp = $('#filePicker');
  inp.value = '';
  inp.accept = accept;
  pickerCallback = cb;
  inp.click();
}
$('#filePicker').addEventListener('change', e => {
  const f = e.target.files[0];
  if(!f || !pickerCallback) return;
  readFile(f).then(url => pickerCallback(url));
});

   ПЛЕЕР
   ========================================================== */
const player = $('#player');
let playingId = null;
player.addEventListener('play',  () => syncTracks());
player.addEventListener('pause', () => syncTracks());
player.addEventListener('ended', () => { playingId = null; syncTracks(); });

function playTrack(id, src){
  if(playingId === id){
    player.paused ? player.play().catch(()=>{}) : player.pause();
  } else {
    playingId = id;
    player.src = src;
    player.play().catch(()=>toast('Не удалось воспроизвести 😕'));
  }
  syncTracks();
}
function syncTracks(){
  document.querySelectorAll('.track').forEach(el => {
    const active = el.dataset.id === playingId && !player.paused;
    el.classList.toggle('playing', active);
    const icon = el.querySelector('.play');
    if(icon) icon.textContent = active ? '❚❚' : '▶';
  });
}

/* ==========================================================
   ЛЕНТА
   ========================================================== */
function collectFeed(){
  const profs = visibleProfiles();
  const all = [];
  for(const p of profs){
    for(const post of p.posts){
      all.push({ post, profile: p });
    }
  }
  all.sort((a,b) => b.post.date - a.post.date);
  return all;
}
function renderFeed(){
  const items = collectFeed();
  const view = $('#view');
  if(!items.length){
    view.innerHTML = `
      <section class="feed-view">
        <div class="feed-head">
          <div><h1>📰 Лента</h1><p class="muted">Свежие публикации со всех страниц</p></div>
          <span class="feed-count">0 публикаций</span>
        </div>
        <div class="empty">
          <div class="big">🌌</div>
          <p>Пока нет публикаций.</p>
          <p class="muted" style="margin-top:6px">Добавь что-нибудь в своём профиле — и это появится здесь.</p>
        </div>
      </section>`;
    return;
  }
  view.innerHTML = `
    <section class="feed-view">
      <div class="feed-head">
        <div><h1>📰 Лента</h1><p class="muted">Свежие публикации со всех страниц</p></div>
        <span class="feed-count">${items.length} ${plural(items.length,'публикация','публикации','публикаций')}</span>
      </div>
      <div class="posts">
        ${items.map(feedPostHTML).join('')}
      </div>
    </section>`;
}
function feedPostHTML({ post, profile }){
  let media = '';
  if(post.type === 'photo' && post.src){
    media = `<div class="post-media"><img class="media" src="${post.src}" alt="${esc(post.title)}" loading="lazy"></div>`;
  } else if(post.type === 'video' && post.src){
    media = `<div class="post-media"><video class="media" src="${post.src}" controls preload="metadata"></video></div>`;
  } else if(post.type === 'music' && post.src){
    media = `<div class="post-media"><audio class="audio" src="${post.src}" controls preload="none"></audio></div>`;
  } else if(post.type === 'pdf' && post.src){
    media = pdfCoverHTML(post, profile.id);
  }
  const text = (post.type === 'poem' || post.type === 'book') && post.text
    ? `<div class="post-text">${esc(post.text)}</div>` : '';

  const comments = Array.isArray(post.comments) ? post.comments : [];
  const commentsBlock = `
    <div class="feed-comments">
      <div class="comments-head">
        💬 ${comments.length} ${plural(comments.length,'комментарий','комментария','комментариев')}
      </div>
      ${comments.length
        ? `<div class="comments-list">
             ${comments.map(c => `
               <div class="comment">
                 <b>${esc(c.author)}</b>
                 <span>${esc(c.text)}</span>
                 <small>${dateStr(c.date)}</small>
               </div>`).join('')}
           </div>`
        : `<div class="comments-empty">Пока никто не комментировал — будь первым</div>`}
      ${state.session
        ? `<form class="comment-form" data-post-id="${post.id}" data-profile-id="${profile.id}">
             <input type="text" placeholder="Написать комментарий..." maxlength="300" autocomplete="off">
             <button type="submit" class="comment-send" title="Отправить">➤</button>
           </form>`
        : ``}
    </div>`;

  return `
    <article class="feed-post">
      <div class="feed-author" data-act="switch" data-id="${profile.id}">
        <div class="mini-avatar">${profile.avatar ? `<img src="${profile.avatar}" alt="">` : esc(profile.name.trim()[0] || '?')}</div>
        <div><b>${esc(profile.name)}</b><small>${TYPE_LABELS[post.type] || ''}</small></div>
        <span class="feed-author-time">${dateStr(post.date)}</span>
      </div>
      ${media}
      <div class="post-info">
        <h4>${esc(post.title)}</h4>
        ${text}
        ${commentsBlock}
      </div>
    </article>`;
}

function stickerHTML(s){
  return `<span class="sticker"
    style="left:${s.x}%;top:${s.y}%;--rot:${s.rot}deg;animation-delay:${s.delay}s"
    title="стикер от ${esc(s.from)}">${s.emoji}</span>`;
}

function pdfCoverHTML(post, profileId){
  const filename = post.filename || 'PDF-документ';
  return `<div class="post-media pdf-cover" data-act="open-pdf"
      data-profile-id="${profileId}" data-post-id="${post.id}"
      title="Открыть PDF">
    <div class="pdf-cover-icon">📄</div>
    <div class="pdf-cover-title">${esc(post.title)}</div>
    <div class="pdf-cover-hint" title="${esc(filename)}">${esc(filename)}</div>
    <span class="btn primary small">📖 Читать PDF</span>
  </div>`;
}

function postHTML(post, owner, profileId){
  let media = '';
  if(post.type === 'photo' && post.src){
    media = `<div class="post-media"><img class="media" src="${post.src}" alt="${esc(post.title)}" loading="lazy"></div>`;
  } else if(post.type === 'video' && post.src){
    media = `<div class="post-media"><video class="media" src="${post.src}" controls preload="metadata"></video></div>`;
  } else if(post.type === 'music' && post.src){
    media = `<div class="post-media"><audio class="audio" src="${post.src}" controls preload="none"></audio></div>`;
  } else if(post.type === 'pdf' && post.src){
    media = pdfCoverHTML(post, profileId);
  }
  const text = (post.type === 'poem' || post.type === 'book') && post.text
    ? `<div class="post-text">${esc(post.text)}</div>` : '';

  const comments = Array.isArray(post.comments) ? post.comments : [];
  const commentHint = comments.length ? `💬 ${comments.length} · ` : '';

  return `
    <article class="post">
      ${media}
      <div class="post-info">
        <div class="post-kind">${TYPE_LABELS[post.type] || ''}</div>
        <h4>${esc(post.title)}</h4>
        ${text}
        <div class="post-foot">
          <span>${commentHint}${dateStr(post.date)}</span>
          ${owner ? `<button class="icon-btn" data-act="del-post" data-id="${post.id}" title="Удалить">🗑</button>` : ''}
        </div>
      </div>
    </article>`;
}

function dateStr(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'short'}) + ' · ' +
         d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}

async function submitUpload(type){
  const p = state.profiles[state.current];
  const title = ($('#f-title').value || '').trim() || 'Без названия';
  const post = { id: uid(), type, title, date: Date.now(), author: p.name, comments: [] };

  if(type === 'poem' || type === 'book'){
    const text = ($('#f-text').value || '').trim();
    if(!text){ toast('Напиши текст ✍️'); return; }
    post.text = text;
  } else {
    const f = $('#f-file').files[0];
    if(!f){ toast(type === 'pdf' ? 'Выбери PDF-файл 📄' : 'Выбери файл 📁'); return; }
    if(type === 'pdf' && f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)){
      toast('Нужен именно PDF-файл 📄'); return;
    }
    post.src = await readFile(f);
    post.filename = f.name;
  }

  p.posts.unshift(post);
  save(); closeModal();
  filter = 'all'; render();
  toast('Опубликовано ✨');
}

/* ==========================================================
   СОБЫТИЯ
   ========================================================== */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-auth-tab]');
  if(tabBtn){ renderAuthTab(tabBtn.dataset.authTab); return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'do-login':    doLogin(); break;
    case 'do-observer': doObserver(); break;
    case 'logout':      doLogout(); break;

    case 'open-app-settings': openAppSettings(); break;
    case 'app-preset': applyAppPreset(el.dataset.id); break;
    case 'app-font':
      if(!tempAppSettings) break;
      tempAppSettings.font = el.dataset.id;
      applyAppSettings(tempAppSettings);
      renderAppSettingsModal();
      break;
    case 'app-density':
      if(!tempAppSettings) break;
      tempAppSettings.density = el.dataset.id;
      applyAppSettings(tempAppSettings);
      renderAppSettingsModal();
      break;
    case 'app-calm':
      if(!tempAppSettings) break;
      tempAppSettings.calm = el.dataset.id === '1';
      applyAppSettings(tempAppSettings);
      renderAppSettingsModal();
      break;
    case 'app-save':  saveAppSettings(); break;
    case 'app-reset': resetAppSettings(); break;

    case 'go-profile':
      state.view = 'profile';
      if(!state.profiles[state.current]) state.current = 'westic';
      save(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      break;

    case 'go-feed':
      state.view = 'feed';
      save(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      break;

    case 'switch':
      state.current = el.dataset.id;
      state.view = 'profile';
      filter = 'all';
      save(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      break;

    case 'filter':
      filter = el.dataset.filter;
      render();
      break;

    case 'upload':
      if(!isOwnerCurrent()){ toast('Только хозяин страницы может добавлять'); break; }
      openUpload(); break;

    case 'pick-type':
      if(!isOwnerCurrent()) break;
      uploadForm(el.dataset.type); break;

    case 'submit-upload':
      if(!isOwnerCurrent()) break;
      submitUpload(el.dataset.type); break;

    case 'close-modal': closeModal(); break;

    case 'stickers':
      if(!currentUser()){ toast('Войдите, чтобы отправлять стикеры'); break; }
      openStickers(); break;

    case 'send-sticker':
      if(!currentUser()){ toast('Войдите, чтобы отправлять стикеры'); break; }
      sendSticker(el.dataset.emoji); break;

    case 'gifts':
      if(!currentUser()){ toast('Войдите, чтобы дарить подарки'); break; }
      openGifts(); break;

    case 'send-gift':
      if(!currentUser()){ toast('Войдите, чтобы дарить подарки'); break; }
      sendGift(+el.dataset.index); break;

    /* --- открытие PDF --- */
    case 'open-pdf': {
      const pid = el.dataset.profileId;
      const postId = el.dataset.postId;
      if(pid && postId) openPdfViewer(pid, postId);
      break;
    }

    case 'theme':
      if(!isOwnerCurrent()) break;
      openTheme(); break;

    case 'preset-pick': {
      if(!isOwnerCurrent() || !tempTheme) break;
      const pr = PRESETS[+el.dataset.index];
      tempTheme.accent = pr.accent;
      tempTheme.bg1    = pr.bg1;
      tempTheme.bg2    = pr.bg2;
      tempTheme.angle  = pr.angle || 140;
      renderThemeModal();
      break;
    }
    case 'font-pick':
      if(!isOwnerCurrent() || !tempTheme) break;
      tempTheme.font = el.dataset.value;
      renderThemeModal();
      break;
    case 'shape-pick':
      if(!isOwnerCurrent() || !tempTheme) break;
      tempTheme.avatarShape = el.dataset.value;
      renderThemeModal();
      break;
    case 'pattern-pick':
      if(!isOwnerCurrent() || !tempTheme) break;
      tempTheme.pattern = el.dataset.value;
      renderThemeModal();
      break;

    case 'apply-theme': {
      if(!isOwnerCurrent() || !tempTheme) break;
      const p = state.profiles[state.current];
      p.theme = {
        accent:      tempTheme.accent,
        bg1:         tempTheme.bg1,
        bg2:         tempTheme.bg2,
        angle:       tempTheme.angle || 140,
        font:        tempTheme.font || 'ui',
        avatarShape: tempTheme.avatarShape || 'circle',
        pattern:     tempTheme.pattern || 'none'
      };
      save(); closeModal(); render();
      toast('Оформление обновлено 🎨');
      break;
    }

    case 'pick-cover':
      if(!isOwnerCurrent()){ toast('Только хозяин страницы может менять фон'); break; }
      pickFile('image/*', url => {
        state.profiles[state.current].cover = url;
        save(); render(); toast('Фон обновлён 🖼');
      });
      break;

    case 'pick-avatar':
      if(!isOwnerCurrent()){ toast('Только хозяин страницы может менять аватар'); break; }
      pickFile('image/*', url => {
        state.profiles[state.current].avatar = url;
        save(); render(); toast('Аватар обновлён 😎');
      });
      break;

    case 'add-friend':
      if(!isOwnerCurrent()){ toast('Только хозяин страницы может добавлять друзей'); break; }
      openAddFriend(); break;

    case 'create-friend':
      if(!isOwnerCurrent()) break;
      createFriend(); break;

    case 'create-friend-account': {
      const u = currentUser();
      const f = state.profiles[state.current];
      if(!u || !f || f.id === u.id || !u.friends.includes(f.id) || f.passHash){
        toast('Недоступно'); break;
      }
      openCreateFriendAccount(f.id);
      break;
    }
    case 'submit-friend-account': {
      const u = currentUser();
      const f = state.profiles[el.dataset.id];
      if(!u || !f || !u.friends.includes(f.id) || f.passHash){
        toast('Недоступно'); break;
      }
      submitFriendAccount(f.id);
      break;
    }

    case 'delete-account': {
      const u = currentUser();
      const target = state.profiles[el.dataset.id];
      if(!u || !target) break;
      const isSelf = u.id === target.id;
      if(!isSelf && !u.friends.includes(target.id)){ toast('Недоступно'); break; }
      openDeleteAccount(target.id);
      break;
    }
    case 'confirm-delete-account':
      confirmDeleteAccount(el.dataset.id);
      break;

    case 'play':
      playTrack(el.dataset.id, el.dataset.src);
      break;

    case 'del-post': {
      if(!isOwnerCurrent()) break;
      const pp = state.profiles[state.current];
      pp.posts = pp.posts.filter(x => x.id !== el.dataset.id);
      save(); render(); toast('Удалено 🗑');
      break;
    }
  }
});

/* Комментарии в ленте */
document.addEventListener('submit', e => {
  const form = e.target.closest('.comment-form');
  if(!form) return;
  e.preventDefault();
  if(!state.session){ toast('Войдите, чтобы комментировать'); return; }

  const input = form.querySelector('input');
  const text = (input.value || '').trim();
  if(!text) return;

  const postId = form.dataset.postId;
  const profileId = form.dataset.profileId;
  const profile = state.profiles[profileId];
  if(!profile) return;
  const post = profile.posts.find(x => x.id === postId);
  if(!post) return;
  if(!Array.isArray(post.comments)) post.comments = [];

  const author = state.session.observer
    ? 'Наблюдатель'
    : (currentUser()?.name || 'Гость');

  post.comments.push({ id: uid(), author, text, date: Date.now() });
  save(); render();
  toast('Комментарий добавлен 💬');
});

/* Сохранение имени/био при потере фокуса */
document.addEventListener('focusout', e => {
  const f = e.target.closest?.('[data-field]');
  if(!f) return;
  if(!isOwnerCurrent()) return;
  const p = state.profiles[state.current];
  const field = f.dataset.field;
  let val = (f.innerText || '').trim();
  if(field === 'name' && !val) val = p.name;
  p[field] = val;
  save();
});

/* Enter / Escape */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); return; }
  const auth = $('#auth');
  if(auth && auth.classList.contains('show')){
    if(e.key === 'Enter'){
      const active = document.querySelector('.auth-tab.active');
      const tab = active?.dataset.authTab;
      if(tab === 'login') doLogin();
      else doObserver();
    }
    return;
  }
  if(e.key === 'Enter' && e.target.id === 'f-name'){
    e.preventDefault();
    createFriend();
  }
});

/* ==========================================================
   СТАРТ
   ========================================================== */
applyAppSettings(state.appSettings);
render();

if(!state.session){
  showAuth('login');
} else {
  hideAuth();
}

window.addEventListener('load', () => {
  setTimeout(() => {
    $('#loader').classList.add('hide');
    setTimeout(() => $('#loader').remove(), 800);
  }, 1100);
});
</script>
</body>
</html>
